name: Canary Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: canary-release
  cancel-in-progress: false

jobs:
  build:
    name: Build canary
    if: github.repository == 'nizos/probity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run checks

      - name: Set canary version
        run: |
          canary_version=$(node -e '
            const { version } = require("./package.json");
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!match) throw new Error(`Expected a stable package version, got ${version}`);
            const [, major, minor] = match;
            console.log(`${major}.${Number(minor) + 1}.0-canary.${process.env.GITHUB_RUN_NUMBER}`);
          ')
          npm version "$canary_version" --no-git-tag-version --ignore-scripts
          echo "Publishing @nizos/probity@$canary_version"

      - name: Pack canary
        run: npm pack --pack-destination "${{ runner.temp }}"

      - name: Verify packed files
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(find "${{ runner.temp }}" -maxdepth 1 -type f -name 'nizos-probity-*.tgz' -print -quit)
          if [[ -z "$tarball" ]]; then
            echo "No canary tarball found"
            exit 1
          fi

          unexpected_files=()
          while IFS= read -r entry; do
            case "$entry" in
              package/|package/dist/|package/dist/*|package/package.json|package/README.md|package/LICENSE)
                ;;
              *)
                unexpected_files+=("$entry")
                ;;
            esac
          done < <(tar -tzf "$tarball")

          if ((${#unexpected_files[@]} > 0)); then
            echo "Unexpected files in $tarball:"
            printf '  %s\n' "${unexpected_files[@]}"
            exit 1
          fi

      - name: Upload canary package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: probity-canary
          path: ${{ runner.temp }}/nizos-probity-*.tgz
          if-no-files-found: error

  publish:
    name: Publish canary
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-canary
    permissions:
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download canary package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: probity-canary
          path: package

      - name: Verify canary version
        shell: bash
        run: |
          # Stop on errors, unset variables, and failed commands in pipelines.
          set -euo pipefail

          # The build job uploads one npm tarball under this directory.
          tarball=$(find package -maxdepth 1 -type f -name 'nizos-probity-*.tgz' -print -quit)
          if [[ -z "$tarball" ]]; then
            echo "No canary tarball found"
            exit 1
          fi

          # Read package.json from the archive without extracting or executing it.
          version=$(tar -xOzf "$tarball" package/package.json | node -e '
            let input = "";
            process.stdin.on("data", chunk => { input += chunk; });
            process.stdin.on("end", () => {
              const { version } = JSON.parse(input);
              process.stdout.write(version);
            });
          ')

          # Never let this job publish a non-canary package under the canary tag.
          if [[ "$version" != *-canary.* ]]; then
            echo "Refusing to publish non-canary version: $version"
            exit 1
          fi

      - name: Stage canary
        run: npm stage publish ./package/*.tgz --tag canary
